<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caja Negra</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --void:#081c2e;
  --bg:#0f385a;
  --panel:#0b2338;
  --panel-2:#10314f;
  --border:#1c527d;
  --border-soft:#14324f;
  --ink:#ffffff;
  --ink-dim:#b9d2e4;
  --ink-faint:#7fa0bf;
  --accent:#1fb2de;
  --accent-2:#1fb2de;
  --accent-dim:#0e3b52;
  --amber:#fbaf17;
  --amber-dim:#4a3410;
  --go:#a6ce38;
  --go-dim:#2e3a12;
  --cond:#15bece;
  --cond-dim:#0e3a3f;
  --nogo:#ff5c5c;
  --nogo-dim:#3a1212;
  --violet:#a78bfa;
  --violet-dim:#241c42;
  --rose:#ec0677;
  --rose-dim:#3d0a2a;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Open Sans',system-ui,sans-serif;
  --cut:13px;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%}
body{
  margin:0;background:var(--void);color:var(--ink);font-family:var(--sans);font-size:16.5px;
  height:100vh;height:100dvh;overflow:hidden;
  background-image:radial-gradient(ellipse at 50% -12%, #16324c 0%, var(--void) 60%);
  -webkit-font-smoothing:antialiased;
}

.app-shell{height:100vh;height:100dvh;display:flex;flex-direction:column}
.topbar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:12px calc(20px + env(safe-area-inset-right)) 12px calc(20px + env(safe-area-inset-left));
  background:var(--void);border-bottom:1px solid var(--border-soft);
  position:relative;z-index:30;
}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:3px;background:linear-gradient(90deg, var(--accent-2), var(--amber), var(--rose), var(--violet), var(--go))}
.topbar-brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:36px;height:36px;border-radius:50%;background:var(--panel-2);border:1.5px solid var(--accent-2);display:flex;align-items:center;justify-content:center;color:var(--accent-2);flex:0 0 auto;box-shadow:0 0 12px -2px rgba(31,178,222,.6)}
.brand-text{font-family:var(--mono);font-weight:700;font-size:13.5px;letter-spacing:.09em;color:var(--ink);line-height:1.3;white-space:nowrap}
.brand-text small{display:block;font-size:9.5px;color:var(--ink-faint);font-weight:600;letter-spacing:.13em}

.switch{display:flex;align-items:center;gap:9px;cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--ink-dim);flex:0 0 auto}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch-track{width:36px;height:20px;border-radius:10px;background:var(--panel-2);border:1px solid var(--border);position:relative;transition:background .2s,border-color .2s;flex:0 0 auto}
.switch-thumb{position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;background:var(--ink-faint);transition:transform .2s,background .2s}
.switch input:checked + .switch-track{background:var(--accent-dim);border-color:var(--accent-2)}
.switch input:checked + .switch-track .switch-thumb{transform:translateX(16px);background:var(--accent-2);box-shadow:0 0 8px var(--accent-2)}

.shell-body{flex:1;display:flex;min-height:0;min-width:0}
.sidebar{
  width:216px;flex:0 0 auto;background:var(--void);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;gap:3px;padding:16px 12px;
  overflow-y:auto;
}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink-dim);font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--panel-2);color:var(--ink)}
.nav-item.active{background:var(--nav-cd, var(--accent-dim));color:var(--nav-c, var(--accent-2));border-color:var(--nav-c, var(--border))}
.nav-item .nav-ic{width:18px;height:18px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--nav-c, currentColor);opacity:.9}
.nav-item:hover .nav-ic,.nav-item.active .nav-ic{opacity:1}

.main{flex:1;min-width:0;min-height:0;display:flex;justify-content:center;overflow:hidden}
@media(max-width:760px){
  .shell-body{flex-direction:column}
  .sidebar{width:100%;min-width:0;height:auto;position:relative;flex-direction:row;overflow-x:auto;padding:8px calc(10px + env(safe-area-inset-left)) 8px calc(10px + env(safe-area-inset-right));gap:6px;border-right:none;border-bottom:1px solid var(--border-soft)}
  .nav-item{flex:0 0 auto;white-space:nowrap;padding:9px 12px}
  .topbar{padding:10px 14px}
}

.stage{
  max-width:none;margin:0 auto;min-height:100%;
  background:linear-gradient(180deg,#0a2136 0%,var(--bg) 6%);
  border-left:1px solid var(--border-soft);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;position:relative;width:100%;flex-shrink:0;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
  transform-origin:top center;
}
button,.decision-btn,.chip,.sign-row,.tab-btn,.seg-opt,.sysdot{touch-action:manipulation}
.stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(180deg,rgba(255,255,255,.012) 0px,rgba(255,255,255,.012) 1px,transparent 1px,transparent 3px),
    repeating-linear-gradient(90deg, rgba(31,178,222,.03) 0px, rgba(31,178,222,.03) 1px, transparent 1px, transparent 64px),
    repeating-linear-gradient(0deg, rgba(31,178,222,.03) 0px, rgba(31,178,222,.03) 1px, transparent 1px, transparent 64px);
  mix-blend-mode:overlay;
}
.hud:empty{display:none}
.hud{position:sticky;top:0;z-index:20;background:rgba(6,13,26,.94);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);border-bottom:1px solid var(--border);padding:12px 16px 10px}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.wordmark{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ink-faint);text-transform:uppercase}
.wordmark b{color:var(--accent-2)}
.hud-tabs{display:flex;gap:2px}
.tab-btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;background:none;border:none;border-bottom:2px solid transparent;color:var(--ink-faint);padding:7px 10px;cursor:pointer}
.tab-btn.active{color:var(--accent-2);border-bottom-color:var(--accent-2);text-shadow:0 0 10px rgba(31,178,222,.6)}
.clock-row{display:flex;align-items:center;gap:14px}
.clock{font-family:var(--mono);font-weight:700;font-size:42px;letter-spacing:.01em;font-variant-numeric:tabular-nums;line-height:1;color:var(--amber);text-shadow:0 0 20px rgba(255,176,32,.3)}
.clock.crit{color:var(--nogo);text-shadow:0 0 20px rgba(255,92,92,.35)}
.phase-meta{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.phase-code{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.1em}
.phase-label{font-family:var(--mono);font-size:13px;color:var(--ink-dim);letter-spacing:.02em}
.rec{width:7px;height:7px;border-radius:50%;background:var(--nogo);display:inline-block;margin-right:6px;animation:blink 1.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.rec{animation:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.progress-track{height:4px;background:var(--border-soft);border-radius:2px;margin-top:10px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s linear;box-shadow:0 0 10px var(--accent)}
.pausebtn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;background:var(--panel);border:1px solid var(--border);color:var(--ink-dim);padding:8px 12px;cursor:pointer;border-radius:10px}
.pausebtn:hover{color:var(--ink)}

.body{flex:1;padding:18px 16px calc(44px + env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative;z-index:1}
.content-wrap{display:flex;flex-direction:column;gap:14px;width:100%;margin-top:auto;margin-bottom:auto}
@media(min-width:860px){.body{padding:26px 34px calc(44px + env(safe-area-inset-bottom))}}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--eyebrow-c, var(--accent-2));display:flex;align-items:center;gap:0}
.outcome-eyebrow{justify-content:center}
.beacon{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--eyebrow-c, var(--accent-2));margin-right:8px;box-shadow:0 0 7px var(--eyebrow-c, var(--accent-2));flex:0 0 auto}
h1{font-size:29px;line-height:1.15;margin:4px 0 2px;text-wrap:balance;font-weight:700}
h2{font-size:21px;margin:0 0 2px;text-wrap:balance;font-weight:600}
.outcome-head{font-size:30px;text-align:center;margin:2px 0 4px}
p{line-height:1.6;color:var(--ink-dim);margin:0}
.lede{color:var(--ink);font-size:17.5px}
.donow{font-weight:700;color:var(--ink);font-size:17px;line-height:1.5;margin:0 0 2px}

.panel{
  position:relative;padding:18px;
  background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 48%), var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:0 0 0 1px rgba(31,178,222,.07), 0 18px 40px -22px rgba(0,0,0,.85);
}
.notice{border-left:3px solid var(--amber);background:linear-gradient(90deg,rgba(255,176,32,.08),transparent 65%)}
.panel-tint{border-left:3px solid var(--panel-accent, var(--border))}
.flash-go{animation:flashGo 1.1s ease-out 2}
.flash-nogo{animation:flashNoGo .6s ease-out 3}
@keyframes flashGo{0%,100%{box-shadow:0 0 0 1px rgba(31,178,222,.07)}50%{box-shadow:0 0 48px -8px var(--go)}}
@keyframes flashNoGo{0%,100%{box-shadow:0 0 0 1px rgba(31,178,222,.07)}50%{box-shadow:0 0 58px -6px var(--nogo)}}
@media(prefers-reduced-motion:reduce){.flash-go{animation:none;box-shadow:0 0 26px -8px var(--go)}.flash-nogo{animation:none;box-shadow:0 0 26px -8px var(--nogo)}}

.stack{display:flex;flex-direction:column;gap:11px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}

button.primary{font-family:var(--mono);font-weight:600;font-size:15.5px;letter-spacing:.03em;background:linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,0) 55%), var(--accent);color:#0f385a;border:none;padding:16px 18px;cursor:pointer;width:100%;min-height:54px;border-radius:14px;box-shadow:0 0 26px -8px var(--accent-2)}
button.primary:active{transform:translateY(1px);filter:brightness(1.25);box-shadow:0 0 44px -4px var(--accent-2)}
button.primary:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
button.ghost{font-family:var(--mono);font-size:15px;letter-spacing:.03em;background:transparent;color:var(--ink-dim);border:1px solid var(--border);padding:13px 14px;cursor:pointer;width:100%;min-height:48px;border-radius:14px;line-height:1.35}
button.ghost:hover{color:var(--ink);border-color:var(--accent);box-shadow:0 0 14px -8px var(--accent)}
button.ghost:active{color:var(--ink);background:var(--accent-dim);border-color:var(--accent-2);box-shadow:0 0 22px -6px var(--accent-2)}
.decision-btn:active{filter:brightness(1.3)}
.chip:active{filter:brightness(1.3)}

.launch-cta{animation:ctaPulse 2.2s ease-in-out infinite}
@keyframes ctaPulse{0%,100%{box-shadow:0 0 26px -8px var(--accent-2)}50%{box-shadow:0 0 48px -4px var(--accent-2)}}
@media(prefers-reduced-motion:reduce){.launch-cta{animation:none}}

.screen-in{animation:screenIn .32s ease}
@keyframes screenIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.screen-in{animation:none}}

.seg{display:flex;gap:6px}
.seg-opt{flex:1;font-family:var(--mono);font-size:17px;font-weight:600;background:var(--panel-2);border:1.5px solid var(--border);color:var(--ink-dim);padding:14px;cursor:pointer;text-align:center}
.seg-opt.active{background:var(--accent-dim);border-color:var(--accent-2);color:var(--accent-2);box-shadow:0 0 14px -6px var(--accent-2)}

label.field{display:flex;flex-direction:column;gap:5px}
.field-label{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint)}
input[type=text],textarea{font-family:var(--sans);font-size:16px;background:var(--panel-2);border:1.5px solid var(--border);color:var(--ink);border-radius:4px;padding:12px 13px;width:100%}
textarea{resize:vertical;min-height:70px;line-height:1.5}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}

.card-system .name{font-family:var(--mono);font-weight:700;font-size:21px;letter-spacing:.02em;color:var(--amber)}
.card-field{border-left:3px solid var(--fc, var(--border));padding-left:12px;margin-top:13px}
.card-field:first-of-type{margin-top:13px}
.card-field-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fc, var(--ink-faint))}
.card-field-body{color:var(--ink);font-size:16.5px;line-height:1.58;margin-top:3px}
.alert-banner{background:var(--amber);color:#3a2504;padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:600;line-height:1.4;text-align:center}

.chip{font-family:var(--mono);font-size:13.5px;background:var(--panel-2);border:1.5px solid var(--border);color:var(--ink-dim);border-radius:20px;padding:9px 14px}
.chip.on{background:var(--go-dim);border-color:var(--go);color:var(--go)}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}

.sign-row{display:flex;align-items:center;gap:11px;width:100%;background:var(--panel-2);border:1.5px solid var(--border);padding:12px 14px;cursor:pointer;font-family:var(--sans);font-size:14.5px;color:var(--ink-dim);border-radius:12px}
.sign-row .box{flex:0 0 auto;width:18px;height:18px;border:1.5px solid var(--ink-faint)}
.sign-row.on{border-color:var(--go);background:var(--go-dim);color:var(--ink)}
.sign-row.on .box{border-color:var(--go);background:var(--go)}
.sign-row .sign-state{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink-faint);flex:0 0 auto}
.sign-row.on .sign-state{color:var(--go)}
.sign-row:active{filter:brightness(1.25)}

.dot{display:inline-block;width:9px;height:9px;transform:rotate(45deg);flex:0 0 auto}
.dot.go{background:var(--go);box-shadow:0 0 6px var(--go)}
.dot.cond{background:var(--cond);box-shadow:0 0 6px var(--cond)}
.dot.nogo{background:var(--nogo);box-shadow:0 0 6px var(--nogo)}
.dot.dim{background:var(--ink-faint)}

.decision-btn{border:1.5px solid var(--border);padding:17px;text-align:center;cursor:pointer;background:var(--panel-2);width:100%;border-radius:12px}
.decision-btn .dtitle{font-family:var(--mono);font-weight:700;font-size:17px;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:9px}
.decision-btn .dsub{font-size:13.5px;color:var(--ink-faint);margin-top:4px}
.decision-btn.go{border-color:var(--go)}
.decision-btn.go.sel{background:var(--go-dim);box-shadow:0 0 20px -8px var(--go)}
.decision-btn.go .dtitle{color:var(--go)}
.decision-btn.cond{border-color:var(--cond)}
.decision-btn.cond.sel{background:var(--cond-dim);box-shadow:0 0 20px -8px var(--cond)}
.decision-btn.cond .dtitle{color:var(--cond)}
.decision-btn.nogo{border-color:var(--nogo)}
.decision-btn.nogo.sel{background:var(--nogo-dim);box-shadow:0 0 20px -8px var(--nogo)}
.decision-btn.nogo .dtitle{color:var(--nogo)}
.decision-btn.pill{border-radius:999px;padding:18px 20px}
.decision-btn.pill .dtitle{font-size:17.5px}
.decision-btn.pill.go{background:var(--go);border-color:var(--go);box-shadow:0 10px 22px -12px var(--go)}
.decision-btn.pill.go .dtitle{color:#1f2b08}
.decision-btn.pill.cond{background:var(--cond);border-color:var(--cond);box-shadow:0 10px 22px -12px var(--cond)}
.decision-btn.pill.cond .dtitle{color:#062024}
.decision-btn.pill.nogo{background:var(--rose);border-color:var(--rose);box-shadow:0 10px 22px -12px var(--rose)}
.decision-btn.pill.nogo .dtitle{color:#3a0420}

.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;border:1px solid;border-radius:10px}
.badge.go{color:var(--go);border-color:var(--go);background:var(--go-dim)}
.badge.cond{color:var(--cond);border-color:var(--cond);background:var(--cond-dim)}
.badge.nogo{color:var(--nogo);border-color:var(--nogo);background:var(--nogo-dim)}
.badge.dim{color:var(--ink-faint);border-color:var(--border)}

.telex{font-family:var(--mono);font-size:14.5px;line-height:1.75;background:var(--panel-2);border:1px solid var(--border);border-radius:4px;padding:15px 16px;white-space:pre-wrap}
.telex .n{color:var(--accent-2)}

.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-tile{background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0) 55%), var(--panel-2);border:1px solid var(--border);padding:15px;text-align:center;border-radius:10px}
.stat-num{font-family:var(--mono);font-weight:700;font-size:33px;font-variant-numeric:tabular-nums;line-height:1}
.stat-num.lg{font-size:44px}
.stat-num.sm{font-size:32px}
.stat-num.amber{color:var(--amber)}
.stat-num.accent{color:var(--accent-2)}
.stat-num.go{color:var(--go)}
.stat-num.cond{color:var(--cond)}
.stat-num.nogo{color:var(--nogo)}
.stat-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);margin-top:7px}
.gap-line{text-align:center;font-family:var(--sans);font-size:14.5px;color:var(--ink);line-height:1.5}
.gap-line b{color:var(--amber)}

.folded-row{display:flex;flex-wrap:wrap;gap:8px}
.fold{min-width:82px;flex:1;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink-faint);text-align:center;flex-direction:column}
.fold.fired{border-color:var(--nogo);color:var(--nogo);background:var(--nogo-dim)}

table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
th{text-align:left;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);padding:7px 7px;border-bottom:1px solid var(--border)}
td{padding:9px 7px;border-bottom:1px solid var(--border-soft);color:var(--ink-dim);vertical-align:top}
td.num{font-variant-numeric:tabular-nums;color:var(--ink)}
.table-wrap{overflow-x:auto;border:1px solid var(--border)}
.empty{color:var(--ink-faint);font-size:14px;text-align:center;padding:30px 10px;font-style:italic}

.wall-line{font-family:var(--mono);font-size:15px;color:var(--ink);border-left:2px solid var(--amber-dim);padding:8px 0 8px 12px;line-height:1.5}

.protocol-list{display:flex;flex-direction:column;gap:11px;list-style:none;margin:0;padding:0;counter-reset:proto}
.protocol-list li{display:flex;gap:11px;font-size:16.5px;color:var(--ink-dim);line-height:1.55;counter-increment:proto}
.protocol-list li::before{content:counter(proto);font-family:var(--mono);font-weight:700;color:var(--accent-2);flex:0 0 auto}
.protocol-list li:nth-child(1)::before{color:var(--rose)}
.protocol-list li:nth-child(2)::before{color:var(--amber)}
.protocol-list li:nth-child(3)::before{color:var(--go)}
.protocol-list li:nth-child(4)::before{color:var(--violet)}
.protocol-list li b{color:var(--ink)}

.turn-name{font-family:var(--mono);font-weight:700;font-size:25px;color:var(--accent-2)}
.queue{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.queue span{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);padding:4px 9px;border:1px solid var(--border);border-radius:12px}
.queue span.now{color:var(--accent-2);border-color:var(--accent-2)}

<div class="app-shell">
  <div class="topbar" id="topbar"></div>
  <div class="shell-body">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">

      </div>

<script>
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const Sound = (function(){
  let ctx = null, master = null, enabled = true, reverb = null, noiseBuf = null;

  function ensure(){
    if(ctx) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = enabled ? 0.34 : 0;
      master.connect(ctx.destination);
      buildNoise();
      buildReverb();
    }catch(e){ ctx = null; }
  }
  function buildNoise(){
    const len = ctx.sampleRate * 1.5;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  }
  function buildReverb(){
    reverb = ctx.createGain();
    reverb.gain.value = 1;
    const damp = ctx.createBiquadFilter(); damp.type='lowpass'; damp.frequency.value=2400;
    damp.connect(master);
    [[0.041,0.32],[0.067,0.26],[0.101,0.2],[0.139,0.15]].forEach(([t,fb])=>{
      const dl = ctx.createDelay(1); dl.delayTime.value = t;
      const g = ctx.createGain(); g.gain.value = fb;
      reverb.connect(dl); dl.connect(g); g.connect(dl); dl.connect(damp);
    });
  }
  function sendReverb(node, amount){
    if(!reverb) return;
    const send = ctx.createGain(); send.gain.value = amount==null?0.4:amount;
    node.connect(send); send.connect(reverb);
  }
  function sweep(f0, f1, dur, type, gainVal, delay, opts){
    if(!ctx || !enabled) return;
    opts = opts || {};
    const t0 = ctx.currentTime + (delay||0);
    const osc = ctx.createOscillator();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(Math.max(20,f0), t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t0+dur*0.72);
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(opts.filterStart||6000, t0);
    if(opts.filterEnd) filt.frequency.exponentialRampToValueAtTime(Math.max(80,opts.filterEnd), t0+dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gainVal||0.14, t0+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(filt); filt.connect(g); g.connect(master);
    if(opts.reverb) sendReverb(g, opts.reverb);
    osc.start(t0); osc.stop(t0+dur+0.03);
  }
  function noiseHit(dur, gainVal, freq, q, delay){
    if(!ctx || !enabled) return;
    const t0 = ctx.currentTime + (delay||0);
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const filt = ctx.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value = freq||1800; filt.Q.value = q||3;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gainVal||0.1, t0+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(filt); filt.connect(g); g.connect(master);
    src.start(t0); src.stop(t0+dur+0.02);
  }

  return {
    primaryClick(){ ensure(); sweep(420,760,0.1,'sine',0.075,0,{filterStart:900,filterEnd:3400,reverb:0.1}); noiseHit(0.03,0.02,3600,5,0.01); },
    ghostClick(){ ensure(); sweep(620,480,0.05,'triangle',0.04,0,{filterStart:2200}); },
    tabClick(){ ensure(); sweep(900,820,0.04,'sine',0.04,0,{filterStart:2800}); },
    selectGo(){ ensure(); sweep(460,780,0.1,'sine',0.08,0,{filterStart:900,filterEnd:3000,reverb:0.1}); },
    selectCond(){ ensure(); sweep(420,580,0.09,'sine',0.075,0,{filterStart:900,filterEnd:2000,reverb:0.07}); },
    selectNogo(){ ensure(); sweep(380,220,0.14,'triangle',0.07,0,{filterStart:1100,filterEnd:380,reverb:0.09}); },
    stamp(){ ensure(); noiseHit(0.055,0.05,700,2.4,0); sweep(210,150,0.08,'sine',0.04,0.008); },
    placeX(){ ensure(); sweep(650,940,0.08,'sine',0.08,0,{filterStart:3600,reverb:0.08}); },
    placeO(){ ensure(); sweep(300,210,0.08,'sine',0.07,0,{filterStart:2200}); },
    win(){ ensure(); [0,0.09,0.18].forEach((d,i)=>sweep([660,880,1108][i],[672,892,1120][i],0.15,'sine',0.09,d,{filterStart:3400,reverb:0.14})); },

  if(hours<20) return unit(hours,'hora','horas');
  const days = Math.round(hours/24);
  if(days<12) return unit(days,'día','días');

}

function fmt(sec){

function currentPhase(){

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function resetSubstateFor(id){

function startMission(){
  if(S.selectedSystems.length !== S.count) return;
  const pool = shuffle(S.selectedSystems);
  S.participants = [];
  for(let i=0;i<S.count;i++){
    S.participants.push({name:'Jugador '+(i+1), cardId:pool[i], fired:false, credited:null});
  }
  S.elapsed = 0; S.running = true; S._lastPhase = null;
  S.sys = {idx:0, q1:null, miniDone:false, ttt:null, miniResult:null, talkPending:false, deciding:false, firedPending:false, firedWait:0, firedName:'', firedReason:'', clearedPending:false, clearedName:'', fixName:'', fixHours:0};
  S._bitStore = {};
  S.fixedDelayHours = 0;
  S.decision = null; S.verifText='';
  S.watchedSystems = []; S.advisorLine = null; S.advisorFailureShown = false;
  S.savedRound = false; S.reflectionSubmitted=0;
  S.launch = null;
  S.screen = 'mission'; S.view = 'mission';
  render();
  runTimer();
}

function runTimer(){
  clearInterval(timerHandle);
  timerHandle = setInterval(()=>{
    if(!S.running) return;
    const busy = S.sys && (S.sys.deciding || S.sys.firedPending || S.sys.clearedPending || S.sys.talkPending);
    S.elapsed++;
    const ph = currentPhase();
    const phaseChanged = !busy && S._lastPhase !== ph.id;
    if(phaseChanged){ S._lastPhase = ph.id; resetSubstateFor(ph.id); }
    let firedTick = false;
    if(S.sys.firedPending && S.sys.firedWait>0){
      S.sys.firedWait--;
      firedTick = true;
    }
    let advisorTick = false;
    if(!S.advisorFailureShown && ph.id==='entrega'){
      const ePhase = PHASES.find(function(pp){ return pp.id==='entrega'; });
      if(S.elapsed >= ePhase.at + FIRMA_WINDOW*0.85){
        S.advisorFailureShown = true;
        S.advisorLine = ADVISOR_LINES.fail;
        advisorTick = true;
      }
    }
    const hitEnd = !busy && S.elapsed >= TOTAL;
    if(hitEnd){ S.elapsed = TOTAL; S.running = false; enterEnd(); }
    renderHUD();
    if(phaseChanged || hitEnd || firedTick || advisorTick){ if(renderBody()) fitScreen(); }
  }, 1000);
}

function advanceNow(){
  const ph = currentPhase();

  const next = PHASES[idx+1];
  if(!next){ S.elapsed = TOTAL; S.running=false; enterEnd(); render(); return; }
  S.elapsed = next.at;
  S._lastPhase = next.id;
  resetSubstateFor(next.id);
  render();
}

function goBack(){
  if(S.screen==='end'){
    const locked = S.launch && (S.launch.stage==='countdown' || (S.launch.stage==='resolved' && ['success','failure'].includes(S.launch.outcome)));
    if(locked) return;
    S.screen='mission';
    const entregaPh = PHASES[PHASES.length-1];
    S.elapsed = entregaPh.at;
    S._lastPhase = entregaPh.id;
    S.launch = null;
    S.running = true;
    render();
    return;
  }
  const ph = currentPhase();
  if(ph.id==='sistemas'){
    if(S.sys.firedPending || S.sys.deciding || S.sys.clearedPending) return;
    if(S.sys.idx>=S.participants.length && S.decision!=null){ S.decision=null; render(); return; }
    if(S.sys.q1!=null){ S.sys.q1=null; render(); return; }
    if(S.sys.miniDone){ S.sys.miniDone=false; S.sys.ttt=null; render(); return; }
    if(S.sys.idx>0){ S.sys.idx--; S.sys.miniDone=true; S.sys.ttt=null; render(); return; }
  }

  const idx = PHASES.findIndex(p=>p.id===ph.id);
  if(idx<=0){ S.screen='setup'; S.running=false; clearInterval(timerHandle); render(); return; }
  const prev = PHASES[idx-1];
  S.elapsed = prev.at;
  S._lastPhase = prev.id;
  resetSubstateFor(prev.id);
  if(prev.id==='sistemas'){ S.sys = {idx:S.participants.length-1, q1:null, miniDone:true, ttt:null, miniResult:null}; }
  render();
}

function tttInit(){ return {board:Array(9).fill(null), over:false, winner:null, winLine:null, botThinking:false}; }
function tttCheckWinner(board){
  const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(const line of lines){
    const [a,b,c] = line;
    if(board[a] && board[a]===board[b] && board[a]===board[c]) return {winner:board[a], line:line};
  }
  if(board.every(c=>c)) return {winner:'draw', line:null};
  return null;
}
function tttSoundForOutcome(winner){
  if(winner==='X') Sound.win();
  else if(winner==='O') Sound.lose();
}
function tttTap(i){
  const t = S.sys.ttt;
  if(!t || t.over || t.board[i] || t.botThinking) return;
  t.board[i] = 'X';
  Sound.placeX();
  const w1 = tttCheckWinner(t.board);
  if(w1){ t.over = true; t.winner = w1.winner; t.winLine = w1.line; tttSoundForOutcome(w1.winner); render(); return; }
  t.botThinking = true;
  render();
  setTimeout(function(){
    const empties = t.board.map((v,idx)=>v?null:idx).filter(v=>v!==null);
    if(empties.length){
      const pick = empties[Math.floor(Math.random()*empties.length)];
      t.board[pick] = 'O';
    }
    Sound.placeO();
    const w2 = tttCheckWinner(t.board);
    t.botThinking = false;
    if(w2){ t.over = true; t.winner = w2.winner; t.winLine = w2.line; tttSoundForOutcome(w2.winner); }
    render();
  }, 1100);
}

function finalizeParticipant(q2){
  const p = S.participants[S.sys.idx];
  S._bitStore[p.cardId] = {q1:S.sys.q1, q2:q2};
  const admitted = (S.sys.q1==='YES' || q2==='YES');
  const saidInRoom = S.sys.q1==='YES';

  if(saidInRoom){
    const sysDef = SYSTEMS.find(s=>s.id===p.cardId);
    const hrs = DELAY_HOURS[p.cardId] || 0;
    S.fixedDelayHours += hrs;
    S.sys.fixName = sysDef ? sysDef.name : '';
    S.sys.fixHours = hrs;
  } else {
    S.sys.fixName = ''; S.sys.fixHours = 0;
  }

  S.sys.idx++; S.sys.q1=null; S.sys.miniDone=false; S.sys.ttt=null; S.sys.miniResult=null;

  if(!admitted){ render(); return; }

  S.sys.deciding = true;
  render();
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(function(){
    const sysDef = SYSTEMS.find(s=>s.id===p.cardId);
    const maxWeight = Math.max.apply(null, SYSTEMS.map(function(s){ return s.weight; }));
    const severity = sysDef ? sysDef.weight / maxWeight : 0;
    const fireProb = Math.min(0.85, Math.max(0.20, 0.40 + 0.40*severity));
    const fired = Math.random() < fireProb;
    p.credited = !fired;
    S.sys.deciding = false;
    const role = AVATARS[p.cardId] ? AVATARS[p.cardId].role : p.name;
    if(fired){
      Sound.fired();
      p.fired = true;
      S.sys.firedPending = true;
      S.sys.firedWait = 10;
      S.sys.firedName = role;
      S.sys.firedReason = FIRE_REASONS[Math.floor(Math.random()*FIRE_REASONS.length)];
    } else {
      Sound.cleared();
      S.sys.clearedPending = true;
      S.sys.clearedName = role;
    }
    render();
  }, reduced ? 0 : 1800);
}

/* ---------- risk model: todo o nada ---------- */
function computeRisk(){
  const pool = S.selectedSystems;
  const contributions = [];
  let survival = 1;
  let allPublic = true;
  for(const sys of SYSTEMS){
    if(!pool.includes(sys.id)) continue;
    const rec = S._bitStore[sys.id];
    const isPublic = !!(rec && rec.q1==='YES');
    const privateOnly = !!(rec && rec.q1!=='YES' && rec.q2==='YES');
    if(!isPublic) allPublic = false;
    let frac = isPublic ? 0 : privateOnly ? HIDDEN_P[sys.id]/2 : HIDDEN_P[sys.id];
    if(S.decision==='COND' && S.watchedSystems && S.watchedSystems.includes(sys.id)){ frac = frac/3; }
    survival *= (1-frac);
    contributions.push({id:sys.id, name:sys.name, happened:sys.happened, contrib:HIDDEN_P[sys.id], hidden:!isPublic, privateOnly});
  }
  // Si a la sala le queda un solo sistema sin decir en voz alta, la misión está condenada:
  // no hay tirada de suerte que la salve. Solo con todo dicho en público entra en juego
  // el riesgo residual (nunca baja de 4%, ni la honestidad total es garantía).
  const risk = allPublic ? Math.max(4, Math.round((1-survival)*100)) : 100;
  contributions.sort((a,b)=>b.contrib-a.contrib);
  return {risk, contributions};
}
function disclosureCounts(){
  const pool = S.selectedSystems;
  let pub=0, priv=0, hidden=0;
  SYSTEMS.forEach(sys=>{
    const inPlay = pool.includes(sys.id);
    const rec = inPlay ? S._bitStore[sys.id] : null;
    if(!inPlay || !rec){ hidden++; return; }
    if(rec.q1==='YES') pub++;
    else if(rec.q2==='YES') priv++;
    else hidden++;
  });
  return {pub,priv,hidden};
}

function enterEnd(){
  S.screen = 'end';
  if(S.decision==null){ S.launch = {stage:'resolved', outcome:'none', ...computeRisk()}; return; }
  const {risk, contributions} = computeRisk();
  if(S.decision==='NOGO'){ S.launch = {stage:'resolved', outcome:'aborted', risk, contributions, boxOpen:false}; return; }
  S.launch = {stage:'ready', count:3, risk, contributions, outcome:null, cause:null, boxOpen:false};
  launchSequence();
}

function launchSequence(){
  if(!S.launch) return;
  S.view = 'mission';
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  S.launch.stage = 'countdown';
  S.launch.count = 3;
  render();
  if(reduced){ resolveLaunch(); return; }
  runCountdown();
}
function runCountdown(){
  Sound.tick();
  setTimeout(()=>{
    S.launch.count--;
    if(S.launch.count>0){ render(); runCountdown(); }
    else { resolveLaunch(); }
  }, 900);
}
function resolveLaunch(){
  const roll = Math.random()*100;
  const fail = roll < S.launch.risk;
  S.launch.stage = 'resolved';
  S.launch.outcome = fail ? 'failure' : 'success';
  if(fail) Sound.failure(); else Sound.success();
  if(fail){
    const hidden = S.launch.contributions.filter(c=>c.hidden).sort((a,b)=>b.contrib-a.contrib);
    S.launch.cause = hidden.length ? hidden[0].id : null;
  }
  render();
}

function registerRound(){
  if(S.savedRound) return;
  const board = loadJSON('tmenos20_tablero', []);
  const d = disclosureCounts();
  board.push({
    sala: board.length+1, decision: S.decision, verifText: S.verifText,
    pub:d.pub, priv:d.priv, hidden:d.hidden,
    outcome: S.launch ? S.launch.outcome : null, risk: S.launch ? S.launch.risk : null,
    ts: Date.now(),
  });
  saveJSON('tmenos20_tablero', board);
  S.savedRound = true;
  render();
}

function newCrew(){ registerRound(); S.screen = 'setup'; S.nav = 'cajanegra'; clearInterval(timerHandle); render(); }
function setCount(n){
  S.count = n;
  S.selectedSystems = (POOL_BY_COUNT[n] || []).slice();
  render();
}
function toggleSystemPick(id){
  const idx = S.selectedSystems.indexOf(id);
  if(idx>=0){ S.selectedSystems.splice(idx,1); }
  else {
    if(S.selectedSystems.length >= S.count) return;
    S.selectedSystems.push(id);
  }
  render();
}

function decisionLabel(d){ return d==='GO' ? 'GO' : d==='COND' ? 'GO CON CONDICIÓN' : d==='NOGO' ? 'NO GO' : 'SIN DECIDIR'; }
function decisionClass(d){ return d==='GO' ? 'go' : d==='COND' ? 'cond' : d==='NOGO' ? 'nogo' : 'dim'; }
function shipTag(r){
  if(r.decision==='NOGO') return '<span class="dot dim"></span>NO DESPEGÓ';
  if(r.outcome==='success') return '<span class="dot go"></span>LLEGÓ';
  if(r.outcome==='failure') return '<span class="dot nogo"></span>NO LLEGÓ';
  return '<span class="dot dim"></span>SIN DATO';
}

  return `<svg class="poli-mark ${extraClass||''}" viewBox="0 0 571.3200073 324.7200012" style="height:${heightPx}px;width:auto" role="img" aria-label="Politécnico Grancolombiano">${POLI_MARK_INNER}</svg>`;

function orbitGraphic(){
  return `<svg viewBox="0 0 120 120">
    <defs>
      <radialGradient id="orbitPlanet" cx="38%" cy="34%" r="70%">
        <stop offset="0%" stop-color="#bfeaf7"/>
        <stop offset="55%" stop-color="var(--accent-2)"/>
        <stop offset="100%" stop-color="#0a3a4d"/>
      </radialGradient>

    <g class="orbit-spin">
      <ellipse cx="60" cy="60" rx="52" ry="15" fill="none" stroke="var(--accent-2)" stroke-width="1.5" opacity=".28" transform="rotate(-18 60 60)"/>
      <ellipse cx="60" cy="60" rx="52" ry="15" fill="none" stroke="var(--accent-2)" stroke-width="2" transform="rotate(18 60 60)"/>
    </g>
    <circle cx="60" cy="60" r="24" fill="url(#orbitPlanet)"/>
    <circle cx="20" cy="24" r="1.8" fill="var(--amber)"/>
    <circle cx="102" cy="30" r="1.4" fill="var(--rose)"/>
    <circle cx="12" cy="88" r="1.4" fill="var(--go)"/>
    <circle cx="106" cy="94" r="1.8" fill="var(--violet)"/>
  </svg>`;
}
const NAV_ITEMS = [
  {key:'inicio', label:'Inicio', icon:'home', c:'--accent-2', cd:'--accent-dim'},
  {key:'cajanegra', label:'Caja Negra', icon:'target', c:'--amber', cd:'--amber-dim'},
  {key:'equipo', label:'Equipo', icon:'team', c:'--rose', cd:'--rose-dim'},
  {key:'mision', label:'Misión', icon:'compass', c:'--violet', cd:'--violet-dim'},
  {key:'recursos', label:'Recursos', icon:'folder', c:'--go', cd:'--go-dim'},
  {key:'configuracion', label:'Configuración', icon:'gear', c:'--ink-dim', cd:'--panel-2'},
];
function setNav(n){ S.nav = n; render(); }
let _lastTopbarKey = null;
function renderTopbar(){
  const key = Sound.isEnabled()?'on':'off';
  if(key===_lastTopbarKey) return;
  _lastTopbarKey = key;
  const el = document.getElementById('topbar');
  el.innerHTML = `
    <div class="topbar-brand">
      ${poliMark(38)}
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="sound-ic">${navIcon('speaker')}</span>
      <label class="switch">
        <input type="checkbox" ${Sound.isEnabled()?'checked':''} onchange="toggleSound()">
        <span class="switch-track"><span class="switch-thumb"></span></span>
        <span>SONIDO ${Sound.isEnabled()?'ON':'OFF'}</span>
      </label>
    </div>
  `;
}
let _lastSidebarKey = null;
function renderSidebar(){
  if(S.nav===_lastSidebarKey) return;
  _lastSidebarKey = S.nav;
  const el = document.getElementById('sidebar');
  el.innerHTML = NAV_ITEMS.map(it=>`
    <button class="nav-item ${S.nav===it.key?'active':''}" style="--nav-c:var(${it.c});--nav-cd:var(${it.cd})" onclick="setNav('${it.key}')">
      <span class="nav-ic">${navIcon(it.icon)}</span>${esc(it.label)}
    </button>
  `).join('');
}

function advanceIntro(){ S.introStep = (S.introStep||0) + 1; render(); }
function renderInicio(){

  if(introStep===0){
    return `

          <p>Aquí fortalecemos las habilidades de nuestra comunidad para que enfrenten con éxito los retos del presente y del futuro.</p>
          ${panel(`
            <div class="creado-panel">
              <div class="creado-ic">${navIcon('team')}</div>
              <div class="creado-body">
                <div class="field-label">Creado por</div>

              </div>
              <div class="creado-bank">${navIcon('bank')}</div>
            </div>
          `)}
          <button class="primary" onclick="advanceIntro()">CONTINUAR →</button>
        </div>

          <div class="showcase-card">
            ${poliMark(64)}
            <div class="orbit-wrap">${orbitGraphic()}</div>

          </div>
        </div>
      </div>
    `;
  }
  if(introStep===1){
    return `

      ${panel(`<p style="text-align:center;color:var(--ink);font-size:16.5px">Ustedes son la tripulación de esta nave. Cada uno controla un sistema distinto, y sin él, la nave no despega. Nadie más en la sala sabe lo que tú sabes sobre el tuyo.</p>`, '', '--accent-2')}

    `;

function renderSistemas(){
  const n = S.participants.length;
  if(S.sys.deciding){ return renderDeciding(); }
  if(S.sys.firedPending){ return renderFiredWait(); }
  if(S.sys.clearedPending){ return renderCleared(); }
  if(S.sys.talkPending){ return renderTalkToTeam(); }
  if(S.sys.idx >= n){
    if(!S.advisorLine && !S.advisorFailureShown){
      S.advisorLine = ADVISOR_LINES.hit[Math.floor(Math.random()*ADVISOR_LINES.hit.length)];
    }
    const confirmados = S.selectedSystems.filter(id=>{ const r=S._bitStore[id]; return r && r.q1==='YES'; }).length;
    return `
      ${eyebrow(currentPhase().code)}
      <h2>Discusión libre</h2>
      <p>Cada quien decidió a solas. Nadie vio la carta de nadie más. Ahora hablen, y decidan juntos.</p>
      <div class="two-col">
        <div class="col-a">
          <div class="donow">▸ Hablen todos, libremente. Cuando la sala esté lista, se reúnen y envían la nave.</div>
          ${panel(`
            <div class="field-label" style="text-align:center">Decisión de la sala</div>
            <p style="text-align:center;margin-top:6px;color:var(--ink)">Con lo que se dijo, y lo que no, en la sala: es hora de decidir.</p>
          `, '', '--accent-2')}
          <button class="primary launch-cta" onclick="confirmLaunchDecision()">ENVIAR LA NAVE AL ESPACIO →</button>
        </div>
        <div class="col-b">
          ${prepBar()}
          ${panel(`<div class="field-label" style="margin-bottom:8px">Sistemas cerrados</div><div class="folded-row">${S.participants.map(pp=>`<div class="fold${pp.fired?' fired':''}">${navIcon(pp.fired?'userx':'lock',16)}<span>${pp.fired?'DESPEDIDO':'CERRADO'}</span></div>`).join('')}</div>`)}
          ${panel(`
            <div class="field-label" style="text-align:center;display:flex;align-items:center;justify-content:center;gap:6px">${navIcon('bars',14)}Estado público de la nave</div>
            <div class="footer-note" style="margin-top:4px">▸ ${confirmados} de ${S.selectedSystems.length} sistemas confirmados en la sala. No se dice cuáles.</div>
            ${S.fixedDelayHours>0 ? `<div class="gap-line" style="margin-top:10px">Retraso ya asumido por lo dicho a tiempo: <b style="color:var(--amber)">${esc(formatDuration(S.fixedDelayHours))}</b></div>` : ''}
          `, '', '--accent-2')}
          ${advisorPanel()}
        </div>
      </div>
      ${backRow()}
    `;
  }
  const p = S.participants[S.sys.idx];
  const sys = SYSTEMS.find(s=>s.id===p.cardId);
  if(!S.sys.miniDone){
    if(!S.sys.ttt) S.sys.ttt = tttInit();
    const t = S.sys.ttt;
    return `
      ${eyebrow(currentPhase().code+' · sistema '+sys.id+' de 6')}
      <h2>Pásale el dispositivo a</h2>
      <div class="sistemas-columns">
        <div class="area-turn">
          <div style="text-align:center">
            ${avatarSVG(sys.id, 76)}
            <div class="turn-name" style="margin-top:6px">${esc(p.name)}</div>
            <div class="field-label" style="margin-top:2px">${esc(AVATARS[sys.id].role)}</div>
          </div>
          ${prepBar()}
          ${panel(`
            <div class="triki-intro">
              <div class="triki-intro-ic">${trikiInfoIcon()}</div>
              <div>
                <div class="field-label" style="color:var(--amber)">TRIKI</div>
                <div style="color:var(--ink);font-weight:600;margin-top:2px">Prueba de acceso a tu sistema</div>
                <div class="footer-note" style="text-align:left;margin-top:6px">▸ Gana el triki para revisar tu sistema.</div>
              </div>
            </div>
          `, '', '--amber')}
        </div>
        <div class="area-triki">
          ${panel(`
            <div class="triki-head">
              <div class="triki-head-ic">${trikiDiceIcon()}</div>
              <div class="triki-head-title grow">TRIKI</div>
            </div>
            <div class="rainbow-bar"></div>
            <div class="donow" style="text-align:center;margin-top:8px">Selecciona una casilla y completa el triki.</div>
            <div class="footer-note" style="margin-top:2px">Encuentra la combinación correcta.</div>
            <div class="ttt-grid">
              ${t.board.map((v,i)=>{
                const win = t.winLine && t.winLine.includes(i);
                const cls = win ? (t.winner==='X'?'win-x':'win-o') : (v?'filled':'');
                const mark = v==='X' ? avatarSVG(sys.id, 44) : v==='O' ? '<span class="dot nogo" style="width:24px;height:24px"></span>' : '';
                return `<button class="ttt-cell ${cls}" onclick="tttTap(${i})" ${(v||t.over||t.botThinking)?'disabled':''}>${mark}</button>`;
              }).join('')}
            </div>
            <div class="ttt-status">
              ${t.botThinking ? `<div class="footer-note">La máquina está pensando…</div>` : ''}
              ${t.over ? `
                <div class="footer-note" style="font-weight:700;color:${t.winner==='X'?'var(--go)':t.winner==='draw'?'var(--ink)':'var(--nogo)'}">${t.winner==='X'?'GANASTE EL TRIKI':t.winner==='draw'?'EMPATE, VUELVE A INTENTAR':'PERDISTE EL TRIKI'}</div>
                ${t.winner==='X'
                  ? `<button class="primary" onclick="tttContinue()">CONTINUAR</button>`
                  : `<button class="primary" onclick="tttRetry()">REINTENTAR</button>`}
              ` : ''}
            </div>
          `)}
        </div>
      </div>
      ${backRow()}
    `;
  }
  if(S.sys.q1==null){
    return `
      ${eyebrow(currentPhase().code+' · sistema '+sys.id+' de 6')}
      <div class="sistemas-columns">
        <div class="area-turn">
          ${panel(`
            <div class="card-system">
              <div class="name">${esc(sys.name)}</div>
              ${cardField('Habilidad', esc(AVATARS[sys.id].ability), '--rose')}
              ${cardField('De qué respondes', esc(sys.does), '--amber')}
              ${cardField('Lo que pasó, y solo tú lo sabes', esc(sys.happened), '--go')}
              ${cardField('Lo que hay detrás', esc(sys.costs), '--go')}
              ${cardField('Cuánto retrasa arreglarlo', esc(formatDuration(DELAY_HOURS[sys.id])), '--accent-2')}
              ${cardField('⚠ Advertencia crítica', 'Decirlo en voz alta puede costarte el puesto. Nadie te va a explicar por qué, solo que ya no estás. Si te quedas callado, mañana sigues teniendo este trabajo, y nadie te va a preguntar por qué no dijiste nada. Si te vas, el juego se acaba aquí para ti.', '--nogo')}
            </div>
          `)}
        </div>
        <div class="area-triki">
          ${panel(`
            <div class="field-label" style="text-align:center">Pásale el dispositivo a</div>
            <div style="text-align:center;margin-top:10px">
              ${avatarSVG(sys.id, 64)}
              <div class="turn-name" style="margin-top:6px">${esc(p.name)}</div>
              <div class="field-label" style="margin-top:2px">${esc(AVATARS[sys.id].role)}</div>
            </div>
          `, '', '--go')}
          ${S.sys.miniResult?`<div class="footer-note" style="text-align:center">${esc('Ganaste el triki de '+MINIGAMES[sys.id].names+'.')}</div>`:''}
          ${prepBar()}
          ${panel(`
            ${eyebrow('Momento de conversación con el equipo y dirección', true)}
            <div class="field-label" style="text-align:center;margin-bottom:12px;margin-top:6px">¿LO DICES EN LA SALA, EN VOZ ALTA?</div>
            <div class="row">
              <button class="decision-btn pill go grow" onclick="pickQ1('YES')"><div class="dtitle">SÍ</div></button>
              <button class="decision-btn pill nogo grow" onclick="pickQ1('NO')"><div class="dtitle">NO</div></button>
            </div>
          `)}
          <div class="queue">${S.participants.map((pp,i)=>`<span class="${pp.fired?'done':i===S.sys.idx?'now':i<S.sys.idx?'done':''}">${esc(pp.name)}${pp.fired?' (despedido)':''}</span>`).join('')}</div>
        </div>
      </div>
      ${backRow()}
    `;
  }
  return `
    ${eyebrow(currentPhase().code+' · segunda decisión')}
    <h2>${esc(p.name)}, no lo vas a decir en la sala</h2>
    <div class="donow">▸ Queda una vía: avisarle solo a la directora de vuelo, en privado. La sala nunca se entera.</div>
    ${alertBanner('⚠ Avisarle a ella tampoco es gratis. Es una persona, no un buzón: puede protegerte o puede no hacerlo, y no vas a saber cuál de las dos hasta que sea tarde.')}
    ${panel(`
      <div class="field-label" style="text-align:center;margin-bottom:12px">¿SE LO DICES EN PRIVADO?</div>
      <div class="row">
        <button class="decision-btn pill cond grow" onclick="pickQ2('YES')"><div class="dtitle">SÍ</div></button>
        <button class="decision-btn pill nogo grow" onclick="pickQ2('NO')"><div class="dtitle">NO</div></button>
      </div>
    `)}
    ${backRow()}
  `;
}

  const circumference = 2*Math.PI*54;
  return `
    <div class="ignition-wrap sm">
      <svg class="ring" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="54" class="ring-track"></circle>
        <circle cx="60" cy="60" r="54" class="ring-fill" style="stroke-dasharray:${circumference};stroke-dashoffset:0"></circle>

    </div>

function challengerStoryHTML(){
  return `
    <p style="color:var(--ink)">El 28 de enero de 1986, la noche anterior al lanzamiento del transbordador Challenger, varios ingenieros advirtieron que las piezas de los cohetes no respondían bien con temperaturas bajas, y recomendaron no lanzar. Los escucharon. En un receso, la dirección de su propia empresa cambió la recomendación y firmó la autorización. Ninguno volvió a levantar la mano.</p>
    <p style="margin-top:10px;color:var(--nogo);font-weight:600">Al día siguiente hacía frío. Esa nave, la del Challenger, se destruyó setenta y tres segundos después de despegar. Iban siete personas.</p>
    <p style="margin-top:10px">No encontraron a un mentiroso. Encontraron una sala llena de gente que sabía una parte, pensó que probablemente no importaba, y calculó lo que le costaba decirlo una vez más.</p>
  `;
}
function challengerStoryPanel(){ return panel(challengerStoryHTML()); }
function disclosurePanels(){
  const src = (S.launch && S.launch.contributions) ? S.launch : computeRisk();
  const publicList = src.contributions.filter(c=>!c.hidden);
  const privateList = src.contributions.filter(c=>c.privateOnly);
  const hiddenList = src.contributions.filter(c=>c.hidden);
  return `
    ${publicList.length ? panel(`
      <div class="field-label" style="margin-bottom:8px">Lo que sí se dijo a tiempo</div>
      <div class="stack">
        ${publicList.map(c=>`<div class="wall-line" style="border-left-color:var(--go)">${esc(c.name)}: alguien lo dijo en voz alta, delante de todos.</div>`).join('')}
      </div>
    `) : ''}
    ${(privateList.length||hiddenList.length) ? panel(`
      <div class="field-label" style="margin-bottom:8px">Lo que la sala nunca supo</div>
      <div class="stack">
        ${privateList.map(c=>{
          const owner = S.participants.find(p=>p.cardId===c.id);
          const note = owner && owner.fired ? 'Avisó en privado, y terminó despedido por asuntos internos.' : owner && owner.credited ? 'Avisó en privado, y siguió en el equipo.' : 'Alguien avisó en privado. En la sala, nadie se enteró.';
          return `<div class="wall-line">${esc(c.name)}: ${note}</div>`;
        }).join('')}
        ${hiddenList.map(c=>`<div class="wall-line">${esc(c.name)}: no se dijo en ningún lado.</div>`).join('')}
      </div>
    `) : panel(`<p style="text-align:center;color:var(--ink)">Todo lo que se sabía se dijo, al menos en privado.</p>`)}
  `;
}

function renderEnd(){

function renderTablero(embedded){
  const board = loadJSON('tmenos20_tablero', []);
  if(!board.length){
    return `${embedded?'':eyebrow('Tablero de misiones')}<h2>Tablero de misiones</h2><div class="empty">Todavía ninguna sala ha registrado su verificación.</div>`;
  }
  const withRisk = board.filter(r=>r.risk!=null);
  const avgRisk = withRisk.length ? Math.round(withRisk.reduce((a,r)=>a+r.risk,0)/withRisk.length) : 0;
  const noDespego = board.filter(r=>r.decision==='NOGO').length;
  const despego = board.filter(r=>r.decision==='GO'||r.decision==='COND').length;
  return `
    ${embedded?'':eyebrow('Se llena a lo largo del día')}
    <h2>Tablero de misiones</h2>
    <p class="lede">Las salas no compiten entre sí. Se compara qué tanto se dijo la verdad, y qué costo cargó cada una.</p>
    ${panel(`
      <div class="stat-row">
        <div class="stat-tile"><div class="stat-num amber">${board.length}</div><div class="stat-label">Salas jugadas</div></div>
        <div class="stat-tile"><div class="stat-num nogo">${avgRisk}%</div><div class="stat-label">Costo promedio</div></div>
        <div class="stat-tile"><div class="stat-num accent">${noDespego}</div><div class="stat-label">No despegaron</div></div>
        <div class="stat-tile"><div class="stat-num nogo">${despego}</div><div class="stat-label">Despegaron</div></div>
      </div>
    `)}
    <div class="table-wrap">
      <table>
        <thead><tr><th>Sala</th><th>Verif.</th><th>Nave</th><th>Público/6</th><th>Costo</th></tr></thead>
        <tbody>
          ${board.slice().reverse().map(r=>`
            <tr>
              <td class="num">${r.sala}</td>
              <td><span class="badge ${decisionClass(r.decision)}">${decisionLabel(r.decision)}</span></td>
              <td class="num">${shipTag(r)}</td>
              <td class="num">${r.pub}/6</td>
              <td class="num">${r.risk!=null?r.risk+'%':'sin dato'}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderKey(){
  if(S.nav!=='cajanegra'){ return 'nav:'+S.nav; }
  if(S.screen==='end'){
    const l = S.launch;
    return 'end|'+(l?l.stage+'|'+l.outcome+'|'+(l.boxOpen?1:0):'');
  }
  if(S.screen!=='mission'){ return S.screen; }
  const busy = S.sys && (S.sys.deciding || S.sys.firedPending || S.sys.clearedPending || S.sys.talkPending);
  const phId = busy ? 'sistemas' : currentPhase().id;
  let extra = '';
  if(phId==='sistemas'){ extra = '|'+S.sys.idx+'|'+(S.sys.miniDone?'q':'m')+'|'+(S.sys.q1||'')+'|talk:'+(S.sys.talkPending?1:0)+'|deciding:'+(S.sys.deciding?1:0)+'|cleared:'+(S.sys.clearedPending?1:0)+'|fired:'+(S.sys.firedPending?(S.sys.firedWait>0?1:2):0); }
  return 'mission|'+phId+extra;
}
let _lastRenderKey = null;
function renderBody(){
  const body = document.getElementById('body');
  let html;
  if(S.nav==='inicio'){ html = renderInicio(); }
  else if(S.nav==='equipo'){ html = renderEquipoPage(); }
  else if(S.nav==='mision'){ html = renderMisionPage(); }
  else if(S.nav==='recursos'){ html = renderRecursosPage(); }
  else if(S.nav==='configuracion'){ html = renderConfiguracionPage(); }
  else {
    const busy = S.screen==='mission' && S.sys && (S.sys.deciding || S.sys.firedPending || S.sys.clearedPending || S.sys.talkPending);
    if(S.screen==='setup'){ html = renderSetup(); }
    else if(busy){ html = renderSistemas(); }
    else if(S.screen==='end'){ html = renderEnd(); }
    else {
      const id = currentPhase().id;
      const map = {
        lectura: renderLectura, sistemas: renderSistemas,
        entrega: renderEntrega,
      };
      html = map[id]();
    }
  }
  const key = renderKey();
  const changed = key !== _lastRenderKey;
  _lastRenderKey = key;
  body.innerHTML = '<div class="content-wrap'+(changed?' screen-in':'')+'">'+html+'</div>';
  return changed;
}

function fitScreen(){
  const stage = document.querySelector('.stage');
  const main = document.querySelector('.main');
  if(!stage || !main) return;
  stage.style.transform = 'none';
  stage.style.width = '100%';
  const availH = main.clientHeight;
  const contentH = stage.scrollHeight;
  const minScale = 0.4;
  let scale = contentH > 0 ? availH / contentH : 1;
  if(scale > 1) scale = 1;
  if(scale < minScale){
    scale = minScale;
    main.style.overflowY = 'auto';
  } else {
    main.style.overflowY = 'hidden';
  }
  if(scale < 1){
    stage.style.width = (100/scale) + '%';
    stage.style.transform = `scale(${scale})`;
  }
}
let _fitRaf = null;
function scheduleFit(){
  if(_fitRaf) cancelAnimationFrame(_fitRaf);
  _fitRaf = requestAnimationFrame(fitScreen);
}
let _fitTimeout = null;
function scheduleFitThorough(){
  scheduleFit();
  if(_fitTimeout) clearTimeout(_fitTimeout);
  _fitTimeout = setTimeout(fitScreen, 300);
}
window.addEventListener('resize', scheduleFitThorough);
window.addEventListener('load', scheduleFitThorough);
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(scheduleFitThorough); }

function render(){ renderTopbar(); renderSidebar(); renderHUD(); const changed = renderBody(); if(changed) fitScreen(); }
render();
document.addEventListener('click', function(e){
  const btn = e.target.closest && e.target.closest('button, .seg-opt, .roster-card');
  if(!btn) return;
  const cls = btn.className || '';
  if(cls.indexOf('ttt-cell')>=0) return; // ya suena por tttTap
  if(cls.indexOf('decision-btn')>=0){
    if(cls.indexOf('go')>=0) Sound.selectGo();
    else if(cls.indexOf('nogo')>=0) Sound.selectNogo();
    else if(cls.indexOf('cond')>=0) Sound.selectCond();
    else Sound.tabClick();
  } else if(cls.indexOf('sign-row')>=0){ Sound.stamp(); }
  else if(cls.indexOf('roster-card')>=0){ Sound.tabClick(); }
  else if(cls.indexOf('tab-btn')>=0 || cls.indexOf('seg-opt')>=0 || cls.indexOf('nav-item')>=0){ Sound.tabClick(); }
  else if(cls.indexOf('primary')>=0){ Sound.primaryClick(); }
  else if(cls.indexOf('ghost')>=0){ Sound.ghostClick(); }
  else { Sound.ghostClick(); }
}, true);
</script>
