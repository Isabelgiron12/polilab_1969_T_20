<title>Caja Negra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --void:#04060a;
  --bg:#080c13;
  --panel:#0f151f;
  --panel-2:#151d29;
  --border:#26313f;
  --border-soft:#1a232e;
  --ink:#eef2f6;
  --ink-dim:#a3b0bf;
  --ink-faint:#7c8998;
  --accent:#5fc6e8;
  --accent-2:#8fe0ff;
  --accent-dim:#213b48;
  --amber:#ffb020;
  --amber-dim:#4a3512;
  --go:#4fdc9a;
  --go-dim:#123526;
  --cond:#e0b84a;
  --cond-dim:#3a2f0d;
  --nogo:#ff5c5c;
  --nogo-dim:#3a1212;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --cut:13px;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--void);color:var(--ink);font-family:var(--sans);font-size:15.5px;
  min-height:100vh;
  background-image:radial-gradient(ellipse at 50% -12%, #0e1a2c 0%, var(--void) 60%);
}
.stage{
  max-width:560px;margin:0 auto;min-height:100vh;
  background:linear-gradient(180deg,#0a0f17 0%,var(--bg) 6%);
  border-left:1px solid var(--border-soft);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;position:relative;
}
.stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(180deg,rgba(255,255,255,.012) 0px,rgba(255,255,255,.012) 1px,transparent 1px,transparent 3px),
    repeating-linear-gradient(90deg, rgba(95,198,232,.03) 0px, rgba(95,198,232,.03) 1px, transparent 1px, transparent 64px),
    repeating-linear-gradient(0deg, rgba(95,198,232,.03) 0px, rgba(95,198,232,.03) 1px, transparent 1px, transparent 64px);
  mix-blend-mode:overlay;
}
.hud{position:sticky;top:0;z-index:20;background:rgba(8,12,19,.94);backdrop-filter:blur(7px);border-bottom:1px solid var(--border);padding:12px 16px 10px}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.wordmark{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ink-faint);text-transform:uppercase}
.wordmark b{color:var(--accent-2)}
.hud-tabs{display:flex;gap:2px}
.tab-btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;background:none;border:none;border-bottom:2px solid transparent;color:var(--ink-faint);padding:7px 10px;cursor:pointer}
.tab-btn.active{color:var(--accent-2);border-bottom-color:var(--accent-2);text-shadow:0 0 10px rgba(143,224,255,.6)}
.clock-row{display:flex;align-items:center;gap:14px}
.clock{font-family:var(--mono);font-weight:700;font-size:42px;letter-spacing:.01em;font-variant-numeric:tabular-nums;line-height:1;color:var(--amber);text-shadow:0 0 20px rgba(255,176,32,.3)}
.clock.crit{color:var(--nogo);text-shadow:0 0 20px rgba(255,92,92,.35)}
.phase-meta{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.phase-code{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.1em}
.phase-label{font-family:var(--mono);font-size:13px;color:var(--ink-dim);letter-spacing:.02em}
.rec{width:7px;height:7px;border-radius:50%;background:var(--nogo);display:inline-block;margin-right:6px;animation:blink 1.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.rec{animation:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.progress-track{height:4px;background:var(--border-soft);border-radius:2px;margin-top:10px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s linear;box-shadow:0 0 10px var(--accent)}
.pausebtn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;background:var(--panel);border:1px solid var(--border);color:var(--ink-dim);padding:8px 12px;cursor:pointer;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.pausebtn:hover{color:var(--ink)}

.body{flex:1;padding:18px 16px 44px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-2);display:flex;align-items:center;gap:0}
.outcome-eyebrow{justify-content:center}
.beacon{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent-2);margin-right:8px;box-shadow:0 0 7px var(--accent-2);flex:0 0 auto}
h1{font-size:27px;line-height:1.15;margin:4px 0 2px;text-wrap:balance;font-weight:700}
h2{font-size:19px;margin:0 0 2px;text-wrap:balance;font-weight:600}
.outcome-head{font-size:30px;text-align:center;margin:2px 0 4px}
p{line-height:1.6;color:var(--ink-dim);margin:0}
.lede{color:var(--ink);font-size:16.5px}
.donow{font-weight:700;color:var(--ink);font-size:16px;line-height:1.5;margin:0 0 2px}

.panel{
  position:relative;padding:18px;
  background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 48%), var(--panel);
  border:1px solid var(--border);
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
  box-shadow:0 0 0 1px rgba(95,198,232,.07), 0 18px 40px -22px rgba(0,0,0,.85);
}
.panel::before,.panel::after{content:"";position:absolute;width:13px;height:13px;border-color:var(--accent-2);opacity:.55;pointer-events:none}
.panel::before{top:-1px;right:-1px;border-top:2px solid;border-right:2px solid}
.panel::after{bottom:-1px;left:-1px;border-bottom:2px solid;border-left:2px solid}
.notice{border-left:3px solid var(--amber);background:linear-gradient(90deg,rgba(255,176,32,.08),transparent 65%)}
.flash-go{animation:flashGo 1.1s ease-out 2}
.flash-nogo{animation:flashNoGo .6s ease-out 3}
@keyframes flashGo{0%,100%{box-shadow:0 0 0 1px rgba(95,198,232,.07)}50%{box-shadow:0 0 48px -8px var(--go)}}
@keyframes flashNoGo{0%,100%{box-shadow:0 0 0 1px rgba(95,198,232,.07)}50%{box-shadow:0 0 58px -6px var(--nogo)}}
@media(prefers-reduced-motion:reduce){.flash-go{animation:none;box-shadow:0 0 26px -8px var(--go)}.flash-nogo{animation:none;box-shadow:0 0 26px -8px var(--nogo)}}

.stack{display:flex;flex-direction:column;gap:11px}
.row{display:flex;gap:10px}
.grow{flex:1}

button.primary{font-family:var(--mono);font-weight:600;font-size:14.5px;letter-spacing:.03em;background:linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,0) 55%), var(--accent);color:#031017;border:none;padding:16px 18px;cursor:pointer;width:100%;min-height:54px;clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));box-shadow:0 0 26px -8px var(--accent-2)}
button.primary:active{transform:translateY(1px);filter:brightness(1.25);box-shadow:0 0 44px -4px var(--accent-2)}
button.primary:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
button.ghost{font-family:var(--mono);font-size:13px;letter-spacing:.03em;background:transparent;color:var(--ink-dim);border:1px solid var(--border);padding:13px 14px;cursor:pointer;width:100%;min-height:46px;clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
button.ghost:hover{color:var(--ink);border-color:var(--accent);box-shadow:0 0 14px -8px var(--accent)}
button.ghost:active{color:var(--ink);background:var(--accent-dim);border-color:var(--accent-2);box-shadow:0 0 22px -6px var(--accent-2)}
.decision-btn:active{filter:brightness(1.3)}
.chip:active{filter:brightness(1.3)}

.launch-cta{animation:ctaPulse 2.2s ease-in-out infinite}
@keyframes ctaPulse{0%,100%{box-shadow:0 0 26px -8px var(--accent-2)}50%{box-shadow:0 0 48px -4px var(--accent-2)}}
@media(prefers-reduced-motion:reduce){.launch-cta{animation:none}}

.screen-in{animation:screenIn .32s ease}
@keyframes screenIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.screen-in{animation:none}}

.seg{display:flex;gap:6px}
.seg-opt{flex:1;font-family:var(--mono);font-size:17px;font-weight:600;background:var(--panel-2);border:1.5px solid var(--border);color:var(--ink-dim);padding:14px;cursor:pointer;text-align:center}
.seg-opt.active{background:var(--accent-dim);border-color:var(--accent-2);color:var(--accent-2);box-shadow:0 0 14px -6px var(--accent-2)}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{font-family:var(--mono);font-size:18px;font-weight:600;background:var(--panel-2);border:1.5px solid var(--border);color:var(--ink);padding:16px;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.key:active{filter:brightness(1.3)}

label.field{display:flex;flex-direction:column;gap:5px}
.field-label{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint)}
input[type=text],textarea{font-family:var(--sans);font-size:16px;background:var(--panel-2);border:1.5px solid var(--border);color:var(--ink);border-radius:4px;padding:12px 13px;width:100%}
textarea{resize:vertical;min-height:70px;line-height:1.5}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}

.card-system{border-left:3px solid var(--amber);padding-left:14px}
.card-system .name{font-family:var(--mono);font-weight:700;font-size:21px;letter-spacing:.02em;color:var(--amber)}
.card-field-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin-top:13px}
.card-field-body{color:var(--ink);font-size:15.5px;line-height:1.58;margin-top:3px}

.chip{font-family:var(--mono);font-size:13.5px;background:var(--panel-2);border:1.5px solid var(--border);color:var(--ink-dim);border-radius:20px;padding:9px 14px}
.chip.on{background:var(--go-dim);border-color:var(--go);color:var(--go)}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}

.sign-row{display:flex;align-items:center;gap:11px;width:100%;background:var(--panel-2);border:1.5px solid var(--border);padding:12px 14px;cursor:pointer;font-family:var(--sans);font-size:14.5px;color:var(--ink-dim);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.sign-row .box{flex:0 0 auto;width:18px;height:18px;border:1.5px solid var(--ink-faint)}
.sign-row.on{border-color:var(--go);background:var(--go-dim);color:var(--ink)}
.sign-row.on .box{border-color:var(--go);background:var(--go)}
.sign-row .sign-state{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink-faint);flex:0 0 auto}
.sign-row.on .sign-state{color:var(--go)}
.sign-row:active{filter:brightness(1.25)}

.dot{display:inline-block;width:9px;height:9px;transform:rotate(45deg);flex:0 0 auto}
.dot.go{background:var(--go);box-shadow:0 0 6px var(--go)}
.dot.cond{background:var(--cond);box-shadow:0 0 6px var(--cond)}
.dot.nogo{background:var(--nogo);box-shadow:0 0 6px var(--nogo)}
.dot.dim{background:var(--ink-faint)}

.decision-btn{border:1.5px solid var(--border);padding:17px;text-align:center;cursor:pointer;background:var(--panel-2);width:100%;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.decision-btn .dtitle{font-family:var(--mono);font-weight:700;font-size:17px;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:9px}
.decision-btn .dsub{font-size:13.5px;color:var(--ink-faint);margin-top:4px}
.decision-btn.go{border-color:var(--go)}
.decision-btn.go.sel{background:var(--go-dim);box-shadow:0 0 20px -8px var(--go)}
.decision-btn.go .dtitle{color:var(--go)}
.decision-btn.cond{border-color:var(--cond)}
.decision-btn.cond.sel{background:var(--cond-dim);box-shadow:0 0 20px -8px var(--cond)}
.decision-btn.cond .dtitle{color:var(--cond)}
.decision-btn.nogo{border-color:var(--nogo)}
.decision-btn.nogo.sel{background:var(--nogo-dim);box-shadow:0 0 20px -8px var(--nogo)}
.decision-btn.nogo .dtitle{color:var(--nogo)}

.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;border:1px solid;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.badge.go{color:var(--go);border-color:var(--go);background:var(--go-dim)}
.badge.cond{color:var(--cond);border-color:var(--cond);background:var(--cond-dim)}
.badge.nogo{color:var(--nogo);border-color:var(--nogo);background:var(--nogo-dim)}
.badge.dim{color:var(--ink-faint);border-color:var(--border)}

.telex{font-family:var(--mono);font-size:14.5px;line-height:1.75;background:var(--panel-2);border:1px solid var(--border);border-radius:4px;padding:15px 16px;white-space:pre-wrap}
.telex .n{color:var(--accent-2)}

.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-tile{background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0) 55%), var(--panel-2);border:1px solid var(--border);padding:15px;text-align:center;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.stat-num{font-family:var(--mono);font-weight:700;font-size:33px;font-variant-numeric:tabular-nums;line-height:1}
.stat-num.amber{color:var(--amber)}
.stat-num.accent{color:var(--accent-2)}
.stat-num.go{color:var(--go)}
.stat-num.cond{color:var(--cond)}
.stat-num.nogo{color:var(--nogo)}
.stat-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);margin-top:7px}
.gap-line{text-align:center;font-family:var(--sans);font-size:14.5px;color:var(--ink);line-height:1.5}
.gap-line b{color:var(--amber)}

.folded-row{display:flex;flex-wrap:wrap;gap:8px}
.fold{width:76px;height:48px;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);text-align:center;flex-direction:column}

table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
th{text-align:left;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);padding:7px 7px;border-bottom:1px solid var(--border)}
td{padding:9px 7px;border-bottom:1px solid var(--border-soft);color:var(--ink-dim);vertical-align:top}
td.num{font-variant-numeric:tabular-nums;color:var(--ink)}
.table-wrap{overflow-x:auto;border:1px solid var(--border)}
.empty{color:var(--ink-faint);font-size:14px;text-align:center;padding:30px 10px;font-style:italic}

.wall-line{font-family:var(--mono);font-size:15px;color:var(--ink);border-left:2px solid var(--amber-dim);padding:8px 0 8px 12px;line-height:1.5}

.protocol-list{display:flex;flex-direction:column;gap:11px;list-style:none;margin:0;padding:0;counter-reset:proto}
.protocol-list li{display:flex;gap:11px;font-size:15.5px;color:var(--ink-dim);line-height:1.55;counter-increment:proto}
.protocol-list li::before{content:counter(proto);font-family:var(--mono);font-weight:700;color:var(--accent-2);flex:0 0 auto}
.protocol-list li b{color:var(--ink)}

.turn-name{font-family:var(--mono);font-weight:700;font-size:25px;color:var(--accent-2)}
.queue{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.queue span{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);padding:4px 9px;border:1px solid var(--border);border-radius:12px}
.queue span.now{color:var(--accent-2);border-color:var(--accent-2)}
.queue span.done{color:var(--ink-faint);text-decoration:line-through;opacity:.5}

.mini-track{position:relative;height:16px;background:var(--panel-2);border:1px solid var(--border);margin:16px 0 18px;overflow:hidden}
.mini-zone{position:absolute;top:0;bottom:0;left:35%;width:30%;background:var(--go-dim);border-left:1px solid var(--go);border-right:1px solid var(--go)}
.mini-marker{position:absolute;top:-3px;bottom:-3px;width:10px;background:var(--accent-2);box-shadow:0 0 10px var(--accent-2);animation:miniSweep 1.6s linear infinite}
@keyframes miniSweep{0%{left:0%}50%{left:calc(100% - 10px)}100%{left:0%}}
@media(prefers-reduced-motion:reduce){.mini-marker{animation:none}}

.footer-note{font-size:12.5px;color:var(--ink-faint);text-align:center;line-height:1.55}
.wcount{font-family:var(--mono);font-size:12px;color:var(--ink-faint);text-align:right}
.wcount.over{color:var(--nogo)}

.checklist{display:flex;flex-direction:column;gap:10px}
.checkline{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;color:var(--ink-dim);line-height:1.55}
.checkline .box{flex:0 0 auto;width:16px;height:16px;border:1.5px solid var(--ink-faint);margin-top:2px}

.sysstrip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:2px 0}
.sysdot{width:42px;height:30px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;letter-spacing:.03em;border:1px solid var(--border);color:var(--ink-faint);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.sysdot.go{border-color:var(--go);color:var(--go);background:var(--go-dim)}
.sysdot.nogo{border-color:var(--nogo);color:var(--nogo);background:var(--nogo-dim);animation:pulseRisk 1.7s ease-in-out infinite}
.sysdot.dim{opacity:.35}
@keyframes pulseRisk{0%,100%{opacity:1}50%{opacity:.5}}
@media(prefers-reduced-motion:reduce){.sysdot.nogo{animation:none}}

.ignition-wrap{position:relative;width:180px;height:180px;margin:8px auto 0}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--border);stroke-width:4}
.ring-fill{fill:none;stroke:var(--accent-2);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .85s linear;filter:drop-shadow(0 0 8px rgba(143,224,255,.7))}
.ignition{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:64px;color:var(--accent-2);text-shadow:0 0 26px rgba(143,224,255,.5)}

.rocket .hull,.rocket .fin{fill:var(--panel-2);stroke:var(--accent-2);stroke-width:2}
.rocket .window{fill:var(--bg);stroke:var(--accent-2);stroke-width:2}
.rocket .flame{fill:var(--amber);opacity:.85;transform-origin:50px 126px}
.rocket.state-idle .flame{opacity:.2}
.rocket.state-countdown .flame{animation:flick .35s ease-in-out infinite alternate}
@keyframes flick{from{transform:scaleY(.85)}to{transform:scaleY(1.2)}}
.rocket.state-success .hull,.rocket.state-success .fin{stroke:var(--go)}
.rocket.state-success .flame{fill:var(--go)}
.rocket.state-failure .hull,.rocket.state-failure .fin{stroke:var(--nogo)}
.rocket.state-failure .flame{fill:var(--nogo);opacity:.35}
.rocket .crack{stroke:var(--nogo);stroke-width:2.5}
@media(prefers-reduced-motion:reduce){.rocket .flame{animation:none!important}}

::selection{background:var(--accent-dim);color:var(--ink)}
</style>

<div class="stage">
  <div class="hud" id="hud"></div>
  <div class="body" id="body"></div>
</div>

  if(days<12) return unit(days,'día','días');
  const weeks = Math.round(days/7);
  if(weeks<7) return unit(weeks,'semana','semanas');
  const months = Math.round(days/30);
  return unit(months,'mes','meses');
}

let timerHandle = null;

function fmt(sec){
  sec = Math.max(0, sec);
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function currentPhase(){
  let ph = PHASES[0];
  for(const p of PHASES){ if(S.elapsed >= p.at) ph = p; }
  return ph;
}
function phaseIndex(){ return PHASES.findIndex(p=>p.id===currentPhase().id); }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function resetSubstateFor(id){
  if(id==='sistemas') S.sys = {idx:0, q1:null, miniDone:false, miniStart:null, miniResult:null};

function startMission(){
  const pool = shuffle(POOL_BY_COUNT[S.count]);

  for(let i=0;i<S.count;i++){
    S.participants.push({name:'Jugador '+(i+1), cardId:pool[i]});
  }
  S.elapsed = 0; S.running = true; S._lastPhase = null;
  S.sys = {idx:0, q1:null, miniDone:false, miniStart:null, miniResult:null};
  S._bitStore = {};
  S.decision = null; S.verifText=''; S.signed={}; S.prediction=null;
  S.savedRound = false; S.reflectionSubmitted=0;
  S.launch = null;
  S.screen = 'mission'; S.view = 'mission';
  render();
  runTimer();
}

function runTimer(){
  clearInterval(timerHandle);
  timerHandle = setInterval(()=>{
    if(!S.running) return;
    S.elapsed++;
    const ph = currentPhase();
    const phaseChanged = S._lastPhase !== ph.id;
    if(phaseChanged){ S._lastPhase = ph.id; resetSubstateFor(ph.id); }
    const hitEnd = S.elapsed >= TOTAL;
    if(hitEnd){ S.elapsed = TOTAL; S.running = false; enterEnd(); }
    renderHUD();
    if(phaseChanged || hitEnd){ renderBody(); }
  }, 1000);
}

function togglePause(){ S.running = !S.running; render(); }

function advanceNow(){
  const ph = currentPhase();
  const idx = PHASES.findIndex(p=>p.id===ph.id);
  const next = PHASES[idx+1];
  if(!next){ S.elapsed = TOTAL; S.running=false; enterEnd(); render(); return; }
  S.elapsed = next.at;
  S._lastPhase = next.id;
  resetSubstateFor(next.id);
  render();
}
function finishNow(){ S.elapsed = TOTAL; S.running = false; enterEnd(); render(); }

function goBack(){
  if(S.screen==='end'){
    const locked = S.launch && (S.launch.stage==='countdown' || (S.launch.stage==='resolved' && ['success','failure'].includes(S.launch.outcome)));
    if(locked) return;
    S.screen='mission';
    const entregaPh = PHASES[PHASES.length-1];
    S.elapsed = entregaPh.at;
    S._lastPhase = entregaPh.id;
    S.launch = null;
    S.running = true;
    render();
    return;
  }
  const ph = currentPhase();
  if(ph.id==='sistemas'){
    if(S.sys.q1!=null){ S.sys.q1=null; render(); return; }
    if(S.sys.miniDone){ S.sys.miniDone=false; S.sys.miniStart=null; render(); return; }
    if(S.sys.idx>0){ S.sys.idx--; S.sys.miniDone=true; S.sys.miniStart=null; render(); return; }
  }
  if(ph.id==='discusion' && S.decision!=null){ S.decision=null; render(); return; }

  const idx = PHASES.findIndex(p=>p.id===ph.id);
  if(idx<=0){ S.screen='setup'; S.running=false; clearInterval(timerHandle); render(); return; }
  const prev = PHASES[idx-1];
  S.elapsed = prev.at;
  S._lastPhase = prev.id;
  resetSubstateFor(prev.id);
  if(prev.id==='sistemas'){ S.sys = {idx:S.participants.length-1, q1:null, miniDone:true, miniStart:null, miniResult:null}; }
  render();
}

function confirmMinigame(){
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced){ S.sys.miniResult='hit'; S.sys.miniDone=true; render(); return; }
  const cycle = 1600;
  const elapsed = (Date.now() - (S.sys.miniStart||Date.now())) % cycle;
  const t = elapsed/cycle;
  const pos = t<0.5 ? (t/0.5) : (1-(t-0.5)/0.5);
  const inZone = pos>=0.35 && pos<=0.65;
  S.sys.miniResult = inZone ? 'hit' : 'miss';
  S.sys.miniDone = true;
  render();
}

/* ---------- risk model ---------- */
function computeRisk(){
  const pool = POOL_BY_COUNT[S.count];
  let survive = 1;
  const contributions = [];
  for(const sys of SYSTEMS){
    const inPlay = pool.includes(sys.id);
    const rec = inPlay ? S._bitStore[sys.id] : null;
    let factor, hidden=false, privateOnly=false;
    if(!inPlay || !rec || (rec.q1!=='YES' && rec.q2!=='YES')){ factor=1; hidden=true; }
    else if(rec.q1==='YES'){ factor=0.06; }
    else { factor=0.25; privateOnly=true; }
    const p = HIDDEN_P[sys.id] * factor;
    survive *= (1-p);
    contributions.push({id:sys.id, name:sys.name, happened:sys.happened, contrib:p, hidden, privateOnly});
  }
  let risk = (1-survive)*100;
  if(S.decision==='COND') risk *= 0.75;
  risk = Math.max(4, Math.min(96, Math.round(risk)));
  contributions.sort((a,b)=>b.contrib-a.contrib);
  return {risk, contributions};
}
function disclosureCounts(){
  const pool = POOL_BY_COUNT[S.count];
  let pub=0, priv=0, hidden=0;
  SYSTEMS.forEach(sys=>{
    const inPlay = pool.includes(sys.id);
    const rec = inPlay ? S._bitStore[sys.id] : null;
    if(!inPlay || !rec){ hidden++; return; }
    if(rec.q1==='YES') pub++;
    else if(rec.q2==='YES') priv++;
    else hidden++;
  });
  return {pub,priv,hidden};
}

function enterEnd(){
  S.screen = 'end';
  if(S.decision==null){ S.launch = {stage:'resolved', outcome:'none', ...computeRisk()}; return; }
  const {risk, contributions} = computeRisk();
  if(S.decision==='NOGO'){ S.launch = {stage:'resolved', outcome:'aborted', risk, contributions, boxOpen:false}; return; }
  S.launch = {stage:'ready', count:3, risk, contributions, outcome:null, cause:null, boxOpen:false};
}

function launchSequence(){
  if(!S.launch) return;
  S.view = 'mission';
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  S.launch.stage = 'countdown';
  S.launch.count = 3;
  render();
  if(reduced){ resolveLaunch(); return; }
  runCountdown();
}
function runCountdown(){
  setTimeout(()=>{
    S.launch.count--;
    if(S.launch.count>0){ render(); runCountdown(); }
    else { resolveLaunch(); }
  }, 900);
}
function resolveLaunch(){
  const roll = Math.random()*100;
  const fail = roll < S.launch.risk;
  S.launch.stage = 'resolved';
  S.launch.outcome = fail ? 'failure' : 'success';
  if(fail){
    const hidden = S.launch.contributions.filter(c=>c.hidden).sort((a,b)=>b.contrib-a.contrib);
    S.launch.cause = hidden.length ? hidden[0].id : null;
  }
  render();
}

function registerRound(){
  if(S.savedRound) return;
  const board = loadJSON('tmenos20_tablero', []);
  const d = disclosureCounts();
  board.push({
    sala: board.length+1, decision: S.decision, verifText: S.verifText,
    pub:d.pub, priv:d.priv, hidden:d.hidden,
    outcome: S.launch ? S.launch.outcome : null, risk: S.launch ? S.launch.risk : null,
    ts: Date.now(),
  });
  saveJSON('tmenos20_tablero', board);
  S.savedRound = true;
  render();
}

          <div class="name">${esc(sys.name)}</div>
          <div class="card-field-label">De qué respondes</div>
          <div class="card-field-body">${esc(sys.does)}</div>
          <div class="card-field-label">Lo que pasó, y solo tú lo sabes</div>
          <div class="card-field-body">${esc(sys.happened)}</div>
          <div class="card-field-label">Lo que hay detrás</div>
          <div class="card-field-body">${esc(sys.costs)}</div>
          <div class="card-field-label">Cuánto retrasa arreglarlo</div>
          <div class="card-field-body">${esc(formatDuration(DELAY_HOURS[sys.id]))}</div>
        </div>
      `)}
      ${panel(`
        <div class="field-label" style="text-align:center;margin-bottom:12px">¿LO DICES EN LA SALA, EN VOZ ALTA?</div>
        <div class="row">
          <button class="decision-btn go grow" onclick="pickQ1('YES')"><div class="dtitle"><span class="dot go"></span>SÍ</div></button>
          <button class="decision-btn nogo grow" onclick="pickQ1('NO')"><div class="dtitle"><span class="dot nogo"></span>NO</div></button>
        </div>
      `)}
      <div class="queue">${S.participants.map((pp,i)=>`<span class="${i===S.sys.idx?'now':i<S.sys.idx?'done':''}">${esc(pp.name)}</span>`).join('')}</div>
      ${backRow()}
    `;
  }
  return `
    ${eyebrow(currentPhase().code+' · segunda decisión')}
    <h2>${esc(p.name)}, no lo vas a decir en la sala</h2>
    <div class="donow">▸ Queda una vía: avisarle solo a la directora de vuelo, en privado. La sala nunca se entera.</div>
    ${panel(`
      <div class="field-label" style="text-align:center;margin-bottom:12px">¿SE LO DICES EN PRIVADO?</div>
      <div class="row">
        <button class="decision-btn cond grow" onclick="pickQ2('YES')"><div class="dtitle"><span class="dot cond"></span>SÍ</div></button>
        <button class="decision-btn nogo grow" onclick="pickQ2('NO')"><div class="dtitle"><span class="dot nogo"></span>NO</div></button>
      </div>
    `)}
    ${backRow()}
  `;
}

function renderDiscusion(){
  return `
    ${eyebrow(currentPhase().code)}
    <h2>Discusión libre</h2>
    <div class="donow">▸ Hablen todos, libremente. Después toquen la decisión de la sala.</div>
    <div class="stack">
      <button class="decision-btn go ${S.decision==='GO'?'sel':''}" onclick="setDecision('GO')" style="text-align:left">
        <div class="dtitle" style="justify-content:flex-start"><span class="dot go"></span>GO</div><div class="dsub" style="text-align:left;margin-left:18px">La nave despega tal como está.</div>
      </button>
      <button class="decision-btn cond ${S.decision==='COND'?'sel':''}" onclick="setDecision('COND')" style="text-align:left">
        <div class="dtitle" style="justify-content:flex-start"><span class="dot cond"></span>GO CON CONDICIÓN</div><div class="dsub" style="text-align:left;margin-left:18px">Despega, pero la sala vigila en vuelo. Reduce el riesgo.</div>
      </button>
      <button class="decision-btn nogo ${S.decision==='NOGO'?'sel':''}" onclick="setDecision('NOGO')" style="text-align:left">
        <div class="dtitle" style="justify-content:flex-start"><span class="dot nogo"></span>NO GO</div><div class="dsub" style="text-align:left;margin-left:18px">Se aborta. Próximo intento en cuatro meses.</div>
      </button>
    </div>
    ${backRow(S.decision?`<button class="primary" onclick="advanceNow()">Confirmar y seguir →</button>`:'')}
  `;
}

function renderVerificacion(){
  const presets = VERIF_PRESETS[S.decision] || VERIF_PRESETS.GO;
  return `
    ${eyebrow(currentPhase().code)}
    <h2>Verificación a la directora de vuelo</h2>
    <div class="donow">▸ Toquen el mensaje que va a mandar la sala.</div>
    ${S.decision?`<span class="badge ${decisionClass(S.decision)}">${decisionLabel(S.decision)}</span>`:''}
    <div class="stack">
      ${presets.map((msg,i)=>`
        <button class="decision-btn go ${S.verifText===msg?'sel':''}" onclick="setVerifText(${i})" style="text-align:left">
          <div class="dtitle" style="justify-content:flex-start;font-size:14.5px">${esc(msg)}</div>
        </button>`).join('')}
    </div>
    <div class="stack" style="gap:9px">
      <div class="field-label">Firmas de la sala (${S.participants.filter((_,i)=>S.signed[i]).length}/${S.participants.length})</div>
      <div class="donow" style="font-size:14px">▸ Cada quien toca su nombre para firmar.</div>
      <div class="stack" style="gap:6px">
        ${S.participants.map((p,i)=>`
          <button class="sign-row ${S.signed[i]?'on':''}" onclick="toggleSign(${i})">
            <span class="box"></span>
            <span class="grow" style="text-align:left">${esc(p.name)}</span>
            <span class="sign-state">${S.signed[i]?'FIRMADO':'TOCAR PARA FIRMAR'}</span>
          </button>
        `).join('')}
      </div>
    </div>
    ${backRow(`<button class="ghost" onclick="advanceNow()">Continuar →</button>`)}
  `;
}

function renderEntrega(){
  const d = disclosureCounts();
  return `
    ${eyebrow(currentPhase().code)}
    <h2>Entrega de sala</h2>
    <div class="donow">▸ Toca el botón para lanzar o abortar la misión.</div>
    ${panel(`
      <div class="checklist">
        <div class="checkline"><span class="box"></span>Decisión: <span class="badge ${decisionClass(S.decision)}" style="margin-left:4px">${decisionLabel(S.decision)}</span></div>
        <div class="checkline"><span class="box"></span>Dicho en la sala: ${d.pub} de 6</div>
        <div class="checkline"><span class="box"></span>Mensaje: <em>${S.verifText? '"'+esc(S.verifText)+'"' : '(sin escribir)'}</em></div>
      </div>
    `)}
    ${prepBar()}
    <div class="field-label" style="text-align:center">Estado público de la nave</div>
    ${systemsStrip()}
    <div class="footer-note">La caja negra solo se abre después del lanzamiento.</div>
    <button class="primary" onclick="finishNow()">Continuar al lanzamiento →</button>
    ${backRow(`<button class="ghost" onclick="registerRound()" ${S.savedRound?'disabled':''}>${S.savedRound?'Registrada ✓':'Registrar ya, sin lanzar'}</button>`)}
  `;
}

/* ---- launch / end sequence ---- */
function renderDebrief(){
  const src = (S.launch && S.launch.contributions) ? S.launch : computeRisk();
  const privateList = src.contributions.filter(c=>c.privateOnly);
  const hiddenList = src.contributions.filter(c=>c.hidden);
  return `
    ${panel(`
      <p style="color:var(--ink)">El 28 de enero de 1986, la noche anterior al lanzamiento del transbordador Challenger, varios ingenieros advirtieron que las piezas de los cohetes no respondían bien con temperaturas bajas, y recomendaron no lanzar. Los escucharon. En un receso, la dirección de su propia empresa cambió la recomendación y firmó la autorización. Ninguno volvió a levantar la mano.</p>
      <p style="margin-top:10px;color:var(--nogo);font-weight:600">Al día siguiente hacía frío. La nave se destruyó setenta y tres segundos después de despegar. Iban siete personas.</p>
      <p style="margin-top:10px">No encontraron a un mentiroso. Encontraron una sala llena de gente que sabía una parte, pensó que probablemente no importaba, y calculó lo que le costaba decirlo una vez más.</p>
    `)}
    ${panel(`
      <div class="field-label" style="text-align:center">Si se arreglaba todo antes de lanzar</div>
      <div style="text-align:center;margin-top:6px"><span class="stat-num amber" style="font-size:38px">${formatDuration(TOTAL_DELAY_HOURS)}</span></div>
      <div class="gap-line" style="margin-top:4px">de retraso total. Así se arma la presión para lanzar de todos modos.</div>
    `)}
    ${(privateList.length||hiddenList.length) ? panel(`
      <div class="field-label" style="margin-bottom:8px">Lo que la sala nunca supo</div>
      <div class="stack">
        ${privateList.map(c=>`<div class="wall-line">${esc(c.name)}: alguien avisó en privado. En la sala, nadie se enteró.</div>`).join('')}
        ${hiddenList.map(c=>`<div class="wall-line">${esc(c.name)}: no se dijo en ningún lado.</div>`).join('')}
      </div>
    `) : panel(`<p style="text-align:center;color:var(--ink)">Todo lo que se sabía se dijo, al menos en privado.</p>`)}
    ${panel(`
      <div class="donow">▸ Toca la razón más parecida, para el muro sin nombre.</div>
      <div class="stack" style="margin-top:10px;gap:6px">
        ${REFLECTION_PRESETS.map((r,i)=>`<button class="ghost" style="text-align:left" onclick="submitPresetReflection(${i})">${esc(r)}</button>`).join('')}
      </div>
      ${S.reflectionSubmitted?`<div class="footer-note" style="margin-top:8px">Dejaste ${S.reflectionSubmitted} línea(s).</div>`:''}
    `)}
    <button class="primary" onclick="registerRound()" ${S.savedRound?'disabled':''}>${S.savedRound?'Sala registrada ✓':'Guardar esta sala en el tablero'}</button>
    <button class="ghost" onclick="newCrew()">Empezar con otra tripulación</button>
  `;
}

function renderLaunchReady(){
  return `
    ${eyebrow('CUENTA FINALIZADA', true)}
    <h1 class="outcome-head">Listos para lanzar</h1>
    <p class="lede" style="text-align:center">Decisión de la sala: <span class="badge ${decisionClass(S.decision)}">${decisionLabel(S.decision)}</span></p>
    ${rocketSVG('idle')}
    ${systemsStrip()}
    ${panel(`
      <div class="field-label" style="text-align:center;margin-bottom:12px">¿CREEN QUE LA NAVE VA A LLEGAR?</div>
      <div class="row">
        <button class="decision-btn go grow ${S.prediction==='YES'?'sel':''}" onclick="setPrediction('YES')"><div class="dtitle"><span class="dot go"></span>SÍ</div></button>
        <button class="decision-btn nogo grow ${S.prediction==='NO'?'sel':''}" onclick="setPrediction('NO')"><div class="dtitle"><span class="dot nogo"></span>NO</div></button>
      </div>
    `)}
    <button class="primary launch-cta" onclick="launchSequence()">AUTORIZAR LANZAMIENTO</button>
    ${backRow()}
  `;
}
function renderLaunchCountdown(){
  const total = 3;
  const circumference = 2*Math.PI*54;
  const offset = circumference * (S.launch.count/total);
  return `
    ${eyebrow('IGNICIÓN', true)}
    <div class="ignition-wrap">
      <svg class="ring" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="54" class="ring-track"></circle>
        <circle cx="60" cy="60" r="54" class="ring-fill" style="stroke-dasharray:${circumference};stroke-dashoffset:${offset}"></circle>
      </svg>
      <div class="ignition">${S.launch.count}</div>
    </div>
    ${rocketSVG('countdown')}
    <p style="text-align:center;color:var(--ink-faint)">La sala ya no puede cambiar nada.</p>
  `;
}
function renderLaunchResolved(){
  const success = S.launch.outcome==='success';
  const causeSys = S.launch.cause!=null ? SYSTEMS.find(s=>s.id===S.launch.cause) : null;
  if(!S.launch.boxOpen){
    return `
      ${eyebrow(success?'SEÑAL NOMINAL':'PÉRDIDA DE VEHÍCULO', true)}
      <h1 class="outcome-head">${success?'La nave despegó y llegó':'La nave despegó y no llegó'}</h1>
      ${rocketSVG(success?'success':'failure')}
      ${panel(`
        ${S.prediction?`<p style="color:var(--ink-dim);margin-bottom:8px">${predictionText(success)}</p>`:''}
        <p style="text-align:center;color:var(--ink)">Toca para abrir la caja negra y ver qué pasó de verdad.</p>
        <button class="primary" style="margin-top:12px" onclick="openBlackBox()">ABRIR LA CAJA NEGRA</button>
      `, success?'flash-go':'flash-nogo')}
    `;
  }
  return `
    ${eyebrow(success?'SEÑAL NOMINAL':'PÉRDIDA DE VEHÍCULO', true)}
    <h1 class="outcome-head">${success?'La nave despegó y llegó':'La nave despegó y no llegó'}</h1>
    ${rocketSVG(success?'success':'failure')}
    ${panel(`<div class="field-label" style="margin-bottom:8px">Caja negra</div><div class="telex">${INFORME.map((l,i)=>`<span class="n">${i+1}.</span> ${esc(l)}`).join('\n\n')}</div>`)}
    ${panel(`
      ${success
        ? `<p style="color:var(--ink)">Esta vez no pasó nada.</p>`
        : causeSys
          ? `<p style="color:var(--ink)">Causa probable: <b>${esc(causeSys.name)}</b>. ${esc(causeSys.happened)}</p>`
          : `<p style="color:var(--ink)">No fue por algo que se ocultó. A veces pasa, incluso cuando la sala dijo todo.</p>`
      }
    `, success?'flash-go':'flash-nogo')}
    ${panel(`
      <div class="field-label" style="text-align:center">Costo de la misión</div>
      <div style="text-align:center;margin-top:6px"><span class="stat-num" style="font-size:52px;color:${success?'var(--amber)':'var(--nogo)'}">${S.launch.risk}%</span></div>
      <div class="gap-line" style="margin-top:4px">de riesgo real que la sala cargó sin saberlo con certeza.</div>
    `)}
    ${renderDebrief()}
  `;
}
function renderAborted(){
  return `
    ${eyebrow('MISIÓN ABORTADA', true)}
    <h1 class="outcome-head">La nave no despegó</h1>
    ${rocketSVG('idle')}
    ${panel(`
      <p style="color:var(--ink)">No despegaron. La ventana se cierra, el próximo intento es en cuatro meses, y alguien tiene que explicar públicamente por qué.</p>
      <p style="margin-top:10px;color:var(--ink)"><b>No hizo falta abrir la caja negra. Evitaron la apuesta. Tomaron la decisión correcta.</b></p>
    `)}
    ${!S.launch.boxOpen
      ? `<button class="ghost" onclick="openBlackBox()">Abrir la caja negra de todos modos</button>`
      : panel(`<div class="field-label" style="margin-bottom:8px">Caja negra</div><div class="telex">${INFORME.map((l,i)=>`<span class="n">${i+1}.</span> ${esc(l)}`).join('\n\n')}</div><div class="footer-note" style="margin-top:10px">Si hubieran lanzado, el costo real habría sido del <b style="color:var(--amber)">${S.launch.risk}%</b>.</div>`)}
    ${backRow()}
    ${renderDebrief()}
  `;
}
function renderNoDecision(){
  return `
    ${eyebrow('SIN DECISIÓN', true)}
    <h1 class="outcome-head">La sala no decidió</h1>
    ${panel(`<p>No se registró GO, GO CON CONDICIÓN ni NO GO antes de que se acabara el tiempo.</p>`)}
    ${backRow()}
    ${renderDebrief()}
  `;
}
function renderEnd(){
  if(!S.launch) enterEnd();
  if(S.launch.outcome==='aborted') return renderAborted();
  if(S.launch.outcome==='none') return renderNoDecision();
  if(S.launch.stage==='ready') return renderLaunchReady();
  if(S.launch.stage==='countdown') return renderLaunchCountdown();
  return renderLaunchResolved();
}

function renderTablero(){
  const board = loadJSON('tmenos20_tablero', []);
  if(!board.length){
    return `${eyebrow('Tablero de misiones')}<h1>Tablero de misiones</h1><div class="empty">Todavía ninguna sala ha registrado su verificación.</div>`;
  }
  const withRisk = board.filter(r=>r.risk!=null);
  const avgRisk = withRisk.length ? Math.round(withRisk.reduce((a,r)=>a+r.risk,0)/withRisk.length) : 0;
  const noDespego = board.filter(r=>r.decision==='NOGO').length;
  const despego = board.filter(r=>r.decision==='GO'||r.decision==='COND').length;
  return `
    ${eyebrow('Se llena a lo largo del día')}
    <h1>Tablero de misiones</h1>
    <p class="lede">Las salas no compiten entre sí. Se compara qué tanto se dijo la verdad, y qué costo cargó cada una.</p>
    ${panel(`
      <div class="stat-row">
        <div class="stat-tile"><div class="stat-num amber">${board.length}</div><div class="stat-label">Salas jugadas</div></div>
        <div class="stat-tile"><div class="stat-num nogo">${avgRisk}%</div><div class="stat-label">Costo promedio</div></div>
        <div class="stat-tile"><div class="stat-num accent">${noDespego}</div><div class="stat-label">No despegaron</div></div>
        <div class="stat-tile"><div class="stat-num nogo">${despego}</div><div class="stat-label">Despegaron</div></div>
      </div>
    `)}
    <div class="table-wrap">
      <table>
        <thead><tr><th>Sala</th><th>Verif.</th><th>Nave</th><th>Público/6</th><th>Costo</th></tr></thead>
        <tbody>
          ${board.slice().reverse().map(r=>`
            <tr>
              <td class="num">${r.sala}</td>
              <td><span class="badge ${decisionClass(r.decision)}">${decisionLabel(r.decision)}</span></td>
              <td class="num">${shipTag(r)}</td>
              <td class="num">${r.pub}/6</td>
              <td class="num">${r.risk!=null?r.risk+'%':'sin dato'}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderMuro(){
  const wall = loadJSON('tmenos20_muro', []);
  return `
    ${eyebrow('Sin nombre')}
    <h1>El muro</h1>
    <p class="lede">Lo que cada tripulación dejó escrito después de su lanzamiento, sin firmar.</p>
    ${wall.length ? panel(`<div class="stack">${wall.map(l=>`<div class="wall-line">${esc(l)}</div>`).join('')}</div>`) : `<div class="empty">El muro sigue en blanco.</div>`}
  `;
}

function renderBody(){
  const body = document.getElementById('body');
  let html;
  if(S.screen==='gate'){ html = renderGate(); }
  else if(S.screen==='intro'){ html = renderIntro(); }
  else if(S.screen==='setup'){ html = renderSetup(); }
  else if(S.view==='tablero'){ html = renderTablero(); }
  else if(S.view==='muro'){ html = renderMuro(); }
  else if(S.screen==='end'){ html = renderEnd(); }
  else {
    const id = currentPhase().id;
    const map = {
      lectura: renderLectura, sistemas: renderSistemas,
      discusion: renderDiscusion, verificacion: renderVerificacion,
      entrega: renderEntrega,
    };
    html = map[id]();
  }
  body.innerHTML = '<div class="screen-in">'+html+'</div>';
}

function render(){ renderHUD(); renderBody(); }
render();
</script>
